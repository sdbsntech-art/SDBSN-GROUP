          script.async = true;

        }

          applyCookieConsent(event.detail);
        });

        try {
          applyCookieConsent(window.localStorage.getItem('alkeb_cookie_consent'));

          console.warn('Unable to read cookie consent; analytics remains disabled.', error);
        }
